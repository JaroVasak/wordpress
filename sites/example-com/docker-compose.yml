---
networks:
  proxy:
    external: true
  db:
    external: true
  internal:
    internal: true

volumes:
  wordpress_files:

services:
  nginx:
    image: nginx:alpine
    container_name: ${SITE_NAME:?required}-nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - wordpress_files:/var/www/html:ro
      - ./wp-content:/var/www/html/wp-content
    depends_on:
      wordpress:
        condition: service_healthy
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${SITE_NAME:?required}.rule=Host(`${DOMAIN:?required}`)"
      - "traefik.http.routers.${SITE_NAME:?required}.entrypoints=websecure"
      - "traefik.http.routers.${SITE_NAME:?required}.tls.certresolver=cloudflare"
      - "traefik.docker.network=proxy"

  wordpress:
    image: wordpress:php8.5-fpm
    container_name: ${SITE_NAME:?required}-fpm
    restart: unless-stopped
    volumes:
      - wordpress_files:/var/www/html
      - ./wp-content:/var/www/html/wp-content
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    environment:
      - WORDPRESS_DB_HOST=mariadb
      - WORDPRESS_DB_NAME=${DB_NAME:?required}
      - WORDPRESS_DB_USER=${DB_USER:?required}
      - WORDPRESS_DB_PASSWORD=${DB_PASSWORD:?required}
      - WORDPRESS_TABLE_PREFIX=${WORDPRESS_TABLE_PREFIX:?required}
      - WORDPRESS_AUTH_KEY=${WORDPRESS_AUTH_KEY:?required}
      - WORDPRESS_SECURE_AUTH_KEY=${WORDPRESS_SECURE_AUTH_KEY:?required}
      - WORDPRESS_LOGGED_IN_KEY=${WORDPRESS_LOGGED_IN_KEY:?required}
      - WORDPRESS_NONCE_KEY=${WORDPRESS_NONCE_KEY:?required}
      - WORDPRESS_AUTH_SALT=${WORDPRESS_AUTH_SALT:?required}
      - WORDPRESS_SECURE_AUTH_SALT=${WORDPRESS_SECURE_AUTH_SALT:?required}
      - WORDPRESS_LOGGED_IN_SALT=${WORDPRESS_LOGGED_IN_SALT:?required}
      - WORDPRESS_NONCE_SALT=${WORDPRESS_NONCE_SALT:?required}
    networks:
      - db
      - internal
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
