server {
    listen 80;
    root /var/www/html;
    index index.php;
    client_max_body_size 64M;
    server_tokens off;

    # Restore the visitor IP. No port is published here, so peers are Docker containers,
    # and the Hetzner firewall admits only Cloudflare to Traefik.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 3;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Per-site additions (sites/<site>/nginx.d/*.conf). Production mounts the
    # directory; with no matching files this include adds nothing.
    include /etc/nginx/site.d/*.conf;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~* /(?:uploads|files)/.*\.php$ {
        deny all;
    }

    # Hidden files stay blocked; /.well-known/ must reach WordPress (OAuth discovery).
    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
    }

    location = /wp-config.php {
        deny all;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        access_log off;
        log_not_found off;
    }
}
