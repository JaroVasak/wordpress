---
networks:
  proxy:
    external: true
  db:
    external: true
  internal:
    internal: true

volumes:
  wordpress_files:

secrets:
  wordpress_db_password:
    environment: DB_PASSWORD

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:1.31.4-alpine
    container_name: ${SITE_NAME:?required}-nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - wordpress_files:/var/www/html:ro
      - ./wp-content:/var/www/html/wp-content:ro
    depends_on:
      wordpress:
        condition: service_healthy
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${SITE_NAME:?required}.rule=Host(`${DOMAIN:?required}`)"
      - "traefik.http.routers.${SITE_NAME:?required}.entrypoints=websecure"
      - "traefik.http.routers.${SITE_NAME:?required}.tls.certresolver=cloudflare"
      - "traefik.docker.network=proxy"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  wordpress:
    image: wordpress:7.1-php8.5-fpm
    container_name: ${SITE_NAME:?required}-fpm
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    volumes:
      - wordpress_files:/var/www/html
      - ./wp-content:/var/www/html/wp-content
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    environment:
      - WORDPRESS_DB_HOST=mariadb
      - WORDPRESS_DB_NAME=${DB_NAME:?required}
      - WORDPRESS_DB_USER=${DB_USER:?required}
      - WORDPRESS_DB_PASSWORD_FILE=/run/secrets/wordpress_db_password
      - WORDPRESS_TABLE_PREFIX=${WORDPRESS_TABLE_PREFIX:?required}
      - "WORDPRESS_CONFIG_EXTRA=define('DISALLOW_FILE_EDIT', true);"
    secrets:
      - wordpress_db_password
    networks:
      - db
      - internal
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
