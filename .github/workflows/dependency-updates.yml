---
name: Dependency updates

on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-updates
  cancel-in-progress: false

jobs:
  renovate:
    name: Open dependency update pull requests
    if: >-
      vars.ENABLE_RENOVATE == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Check token configuration
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [ -z "$RENOVATE_TOKEN" ]; then
            echo '::error::Add the RENOVATE_TOKEN repository secret before enabling Renovate.'
            exit 1
          fi

      - name: Run Renovate for this repository
        # renovatebot/github-action v46.3.13
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          renovate-version: 44.257.1
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_AUTODISCOVER: 'false'
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_ALLOWED_COMMANDS: '[]'
