---
name: Validate

on:  # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automation:
    name: Workflow and dependency configuration checks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      # renovate: datasource=docker depName=rhysd/actionlint
      ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12
      # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
      RENOVATE_VALIDATOR_IMAGE: ghcr.io/renovatebot/renovate:44.257.1

    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Lint GitHub Actions workflows
        run: >-
          docker run --rm --network none
          --volume "$PWD:/repo:ro" --workdir /repo
          "$ACTIONLINT_IMAGE" -color

      - name: Validate Renovate configuration
        run: >-
          docker run --rm --network none
          --volume "$PWD:/repo:ro" --workdir /repo
          "$RENOVATE_VALIDATOR_IMAGE"
          renovate-config-validator --strict renovate.json

  repository:
    name: Repository checks
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install cloud-init validators
        run: |
          sudo apt-get update
          sudo apt-get install --yes cloud-init yamllint

      - name: Run validation
        run: ./scripts/validate.sh

      - name: Set up Terraform
        # hashicorp/setup-terraform v4.0.1
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.17.2

      - name: Check Terraform formatting
        run: terraform -chdir=infra fmt -check -recursive

      - name: Initialize Terraform
        run: >-
          terraform -chdir=infra init -backend=false -input=false
          -lockfile=readonly

      - name: Validate Terraform
        run: terraform -chdir=infra validate

      - name: Test firewall policy without cloud credentials
        run: terraform -chdir=infra test
