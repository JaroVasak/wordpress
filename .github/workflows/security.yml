---
name: Security

on:  # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '45 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository security scan
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Scan dependencies, Terraform, and secrets
        # aquasecurity/trivy-action v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          format: table
          output: trivy-repository.txt
          skip-dirs: .git,infra/.terraform,shared/mariadb,backups

      - name: Save security report
        if: ${{ !cancelled() }}
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: security-repository
          path: trivy-repository.txt
          if-no-files-found: warn
          retention-days: 14

  result:
    name: Security checks
    if: ${{ always() }}
    needs: [repository, images, containers]
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - name: Require every security job to succeed
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          DISCOVERY_RESULT: ${{ needs.images.result }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
        run: |
          if [ "$REPOSITORY_RESULT" != success ] ||
             [ "$DISCOVERY_RESULT" != success ] ||
             [ "$CONTAINERS_RESULT" != success ]; then
            echo '::error::A security scan failed or did not complete. Review the scan jobs.'
            exit 1
          fi

  images:
    name: Discover configured container images
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.images.outputs.matrix }}

    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Read unique image references from Compose files
        id: images
        env:
          CF_DNS_API_TOKEN: validation-placeholder
          MYSQL_ROOT_PASSWORD: validation-placeholder
          DB_PASSWORD: validation-placeholder
        run: |
          image_list="$RUNNER_TEMP/wordpress-images.txt"
          docker compose --env-file shared/.env.example \
            -f shared/docker-compose.yml config --images > "$image_list"
          docker compose --env-file templates/site/.env.example \
            -f templates/site/docker-compose.yml config --images >> "$image_list"
          docker compose --env-file local/.env.example \
            -f local/docker-compose.yml config --images >> "$image_list"
          images=$(sort -u "$image_list" | \
            jq -R -s -c 'split("\n") | map(select(length > 0))')
          test "$(jq 'length' <<< "$images")" -gt 0
          echo "matrix=$images" >> "$GITHUB_OUTPUT"

  containers:
    name: Container security scan (${{ matrix.image }})
    needs: images
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        image: ${{ fromJSON(needs.images.outputs.matrix) }}

    steps:
      - name: Check out reviewed security policy
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Collect all container vulnerabilities (advisory)
        id: inventory
        # aquasecurity/trivy-action v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.2
          scan-type: image
          image-ref: ${{ matrix.image }}
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '0'
          timeout: 10m
          format: json
          output: trivy-image-all.json

      - name: Select exclusions for the exact reviewed helper
        id: review
        env:
          IMAGE_REF: ${{ matrix.image }}
        run: |
          ignore_file=$(./.github/security/select-reviewed-findings.sh \
            "$IMAGE_REF" trivy-image-all.json)
          echo "ignore_file=$ignore_file" >> "$GITHUB_OUTPUT"

      # Advisory: upstream images often lag behind a fix, so findings here warn
      # instead of failing. Scanner and report errors still fail the next step.
      - name: Check fixable HIGH and CRITICAL container vulnerabilities (advisory)
        id: fixable
        continue-on-error: true
        # aquasecurity/trivy-action v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.2
          skip-setup-trivy: 'true'
          scan-type: image
          image-ref: ${{ matrix.image }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: 'true'
          trivyignores: ${{ steps.review.outputs.ignore_file }}
          exit-code: '1'
          timeout: 10m
          format: json
          output: trivy-image-fixable.json

      - name: Publish full and fixable vulnerability summaries
        if: ${{ !cancelled() && steps.inventory.outcome == 'success' }}
        env:
          IMAGE_REF: ${{ matrix.image }}
        run: |
          trivy convert --scanners vuln --format table --exit-code 0 \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --output trivy-image-all.txt trivy-image-all.json
          if [ ! -s trivy-image-fixable.json ]; then
            echo '::error::The fixable vulnerability scan did not produce a report.'
            exit 1
          fi
          if ! jq -e --slurpfile fixable trivy-image-fixable.json \
            '.ArtifactID != null and .ArtifactID == $fixable[0].ArtifactID' \
            trivy-image-all.json > /dev/null; then
            echo '::error::Image IDs differ or a vulnerability report is invalid. Retry the scans.'
            exit 1
          fi
          trivy convert --scanners vuln --format table --exit-code 0 \
            --severity HIGH,CRITICAL \
            --output trivy-image-fixable.txt trivy-image-fixable.json
          {
            # Backticks format Markdown; they are not command substitutions.
            # shellcheck disable=SC2016
            printf '### Container vulnerabilities: `%s`\n\n' "$IMAGE_REF"
            jq -r --slurpfile fixable trivy-image-fixable.json '
              def findings: [.Results[]?.Vulnerabilities[]?];
              findings as $all | ($fixable[0] | findings) as $blocking |
              "| Severity | All | Fix listed | No fix | Reviewed exclusions | Fixable, not excluded |",
              "|---|---:|---:|---:|---:|---:|",
              (["CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN"][] as $severity |
                ($all | map(select(.Severity == $severity)) | length) as $total |
                (if ($severity == "HIGH" or $severity == "CRITICAL") then
                  ($blocking | map(select(.Severity == $severity)) | length)
                else null end) as $count |
                if $count == null then
                  "| \($severity) | \($total) | — | — | — | Advisory only |"
                else
                  ($all | map(select(.Severity == $severity and
                    (.FixedVersion // "") != "")) | length) as $listed |
                  if $count > $listed then error("Inconsistent fixable scan counts")
                  else
                    "| \($severity) | \($total) | \($listed) | \($total - $listed) | \($listed - $count) | \($count) |"
                  end
                end)
            ' trivy-image-all.json
            printf '\nFull and fixable reports are in the security-image artifact for this job.\n'
            printf 'Fixable HIGH/CRITICAL findings are reported as warnings and do not fail the check.\n'
            printf 'Reviewed exclusions apply only to the verified helper SHA-256 and listed CVEs, and expire.\n'
          } >> "$GITHUB_STEP_SUMMARY"
          fixable=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-image-fixable.json)
          if [ "$fixable" -gt 0 ]; then
            echo "::warning title=Container vulnerabilities::$IMAGE_REF has $fixable fixable HIGH/CRITICAL finding(s). See the job summary and the security-image artifact."
          fi

      - name: Save container report
        if: ${{ !cancelled() }}
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: security-image-${{ strategy.job-index }}
          path: |
            trivy-image-all.json
            trivy-image-all.txt
            trivy-image-fixable.json
            trivy-image-fixable.txt
          if-no-files-found: warn
          retention-days: 14
